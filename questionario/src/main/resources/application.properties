spring.application.name=questionario

# =========================
# PORTA DA APLICAÇÃO
# =========================
# Em Docker usamos SERVER_PORT se quiser mudar, senão fica 8080
server.port=${SERVER_PORT:8080}

# =========================
# MYSQL (COM VARIÁVEIS DE AMBIENTE)
# =========================
# Em desenvolvimento local (sem Docker), ele usa o default (localhost)
# Em produção / Docker, você sobrescreve via SPRING_DATASOURCE_URL, USERNAME, PASSWORD

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/questionario_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:cpa_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:false}
spring.flyway.baseline-on-migrate=true

# Observabilidade
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true
management.health.db.enabled=true
management.health.mail.enabled=${APP_EMAIL_CONVITES_ENABLED:false}

# Dados de demonstracao ficam desligados por padrao.
# Ative explicitamente em desenvolvimento com APP_DEMO_DATA_ENABLED=true.
app.demo-data.enabled=${APP_DEMO_DATA_ENABLED:false}
app.demo-data.admin-password=${APP_DEMO_ADMIN_PASSWORD:}
app.demo-data.aluno-password=${APP_DEMO_ALUNO_PASSWORD:}
app.demo-data.professor-password=${APP_DEMO_PROFESSOR_PASSWORD:}

# Usuario tecnico dev. Mantido desligado por padrao.
app.dev-user.enabled=${APP_DEV_USER_ENABLED:false}
app.dev-user.username=${APP_DEV_USERNAME:dev}
app.dev-user.password=${APP_DEV_PASSWORD:}
app.dev-user.email=${APP_DEV_EMAIL:dev@sistema.local}
app.dev-user.name=${APP_DEV_NAME:Desenvolvedor do Sistema}

# Privacidade e criterios de indicadores
app.privacidade.minimo-respostas-grupo=${APP_PRIVACIDADE_MINIMO_RESPOSTAS_GRUPO:5}
app.privacidade.permite-relatorio-individual=${APP_PRIVACIDADE_PERMITE_RELATORIO_INDIVIDUAL:false}
app.resultados.limite-muito-insatisfeito=${APP_RESULTADOS_LIMITE_MUITO_INSATISFEITO:1.5}
app.resultados.limite-insatisfeito=${APP_RESULTADOS_LIMITE_INSATISFEITO:2.5}
app.resultados.limite-neutro=${APP_RESULTADOS_LIMITE_NEUTRO:3.0}
app.resultados.limite-satisfeito=${APP_RESULTADOS_LIMITE_SATISFEITO:3.5}

# Seguranca de login e senha
app.security.login.max-failed-attempts=${APP_SECURITY_LOGIN_MAX_FAILED_ATTEMPTS:5}
app.security.login.lock-minutes=${APP_SECURITY_LOGIN_LOCK_MINUTES:15}
app.security.password.min-length=${APP_SECURITY_PASSWORD_MIN_LENGTH:10}
app.security.password.max-length=${APP_SECURITY_PASSWORD_MAX_LENGTH:128}
app.security.password.min-categories=${APP_SECURITY_PASSWORD_MIN_CATEGORIES:3}

# Email
app.email.convites.enabled=${APP_EMAIL_CONVITES_ENABLED:false}
app.email.base-url=${APP_EMAIL_BASE_URL:http://localhost:8080}
spring.mail.host=${SPRING_MAIL_HOST:}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_SMTP_STARTTLS_ENABLE:true}

# Timezone
spring.jackson.time-zone=America/Sao_Paulo
spring.jpa.properties.hibernate.jdbc.time_zone=America/Sao_Paulo

# THYMELEAF
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=false

