<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Avaliação já respondida</title>
  <link rel="stylesheet" th:href="@{/css/cpa-ui.css}" />
</head>
<body class="cpa-body">
<div class="cpa-page">
  <div th:replace="~{fragments :: header('minhas-avaliacoes', 'Painel do Aluno')}"></div>

  <main class="cpa-main cpa-main-narrow">
    <section class="cpa-panel" style="margin-top:48px; text-align:center">
      <div class="cpa-icon-box" style="margin:0 auto 14px">OK</div>
      <p class="cpa-kicker">Avaliacao</p>
      <h1 class="cpa-panel-title">Nao foi possivel abrir esta avaliacao</h1>
      <p class="cpa-panel-subtitle" th:text="${error != null ? error : 'Nosso sistema identificou que esta avaliacao ja foi respondida ou nao esta disponivel para voce.'}">
        Nosso sistema identificou que esta avaliacao ja foi respondida ou nao esta disponivel para voce.
      </p>
      <div class="cpa-actions" style="justify-content:center; margin-top:22px">
        <a href="/avaliacoes/disponiveis" class="cpa-button cpa-button-primary">Ver minhas avaliacoes</a>
        <a href="/home" class="cpa-button cpa-button-secondary">Voltar ao painel</a>
      </div>
    </section>
  </main>

  <div th:replace="~{fragments :: footer}"></div>
</div>
<script th:src="@{/js/cpa-ui.js}"></script>
<template hidden aria-hidden="true" th:remove="all">

<header class="bg-red-700 text-white shadow">
  <div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center gap-4">
    <a href="/home" class="font-semibold tracking-tight text-lg flex items-center gap-3">
      <span class="inline-flex items-center justify-center h-9 w-9 rounded-md bg-red-800 text-xs font-bold">
        CPA
      </span>
      <div class="flex flex-col leading-tight">
        <span class="text-sm uppercase tracking-[0.2em] text-red-100">Sistema CPA</span>
        <span class="text-base">Painel do Aluno</span>
      </div>
    </a>

    <nav class="hidden md:flex items-center gap-5 text-xs font-medium"
         sec:authorize="hasAuthority('ROLE_ALUNO')">
      <a href="/avaliacoes/disponiveis" class="hover:text-red-100 transition">
        Minhas Avaliações
      </a>
      <form th:action="@{/logout}" method="post" class="inline">
        <input type="hidden" th:name="${_csrf?.parameterName}" th:value="${_csrf?.token}" />
        <button type="submit"
                class="ml-2 px-3 py-1.5 rounded-full bg-red-900 hover:bg-red-800 text-[11px] font-semibold shadow-sm transition">
          Sair
        </button>
      </form>
    </nav>

    <!-- Versão mobile -->
    <div class="flex md:hidden items-center gap-2">
      <a href="/avaliacoes/disponiveis"
         class="text-xs px-3 py-1.5 rounded-full bg-red-800 hover:bg-red-900 transition">
        Avaliações
      </a>
      <form th:action="@{/logout}" method="post" class="inline" sec:authorize="isAuthenticated()">
        <input type="hidden" th:name="${_csrf?.parameterName}" th:value="${_csrf?.token}" />
        <button
          type="submit"
          class="px-3 py-1.5 rounded-full bg-red-900 hover:bg-red-800 text-[11px] font-semibold shadow-sm transition">
          Sair
        </button>
      </form>
    </div>
  </div>
</header>

<main class="flex-1 flex items-center justify-center px-4 py-10">
  <div class="bg-white border border-red-100 shadow-xl rounded-2xl p-10 max-w-md w-full text-center">
    <div class="mb-3">
      <span class="inline-flex items-center justify-center h-12 w-12 rounded-full bg-red-50 text-red-700 text-2xl">
        ✓
      </span>
    </div>
    <h1 class="text-2xl font-bold text-slate-900 mb-3">
      Avaliação já respondida
    </h1>
    <p class="text-slate-600 mb-6 text-sm">
      Nosso sistema identificou que você já respondeu esta avaliação.
      Cada aluno pode enviar suas respostas apenas uma vez por combinação de turma e questionário.
    </p>

    <div class="flex flex-col gap-3 items-center">
      <a href="/avaliacoes/disponiveis"
         class="inline-block bg-red-700 text-white px-6 py-2 rounded-lg font-medium shadow-sm hover:bg-red-800 transition text-sm">
        Ver outras avaliações disponíveis
      </a>
      <a href="/home"
         class="inline-block text-red-700 hover:text-red-900 font-medium text-sm">
        ← Voltar ao painel
      </a>
    </div>
  </div>
</main>

<footer class="border-t border-slate-200 bg-white">
  <div class="max-w-4xl mx-auto px-4 py-4 text-center text-xs text-slate-500">
    © 2025 Sistema de Avaliação CPA
  </div>
</footer>
</template>
</body>
</html>
