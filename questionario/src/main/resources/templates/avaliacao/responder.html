<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>Responder avaliacao - Sistema CPA</title>
  <link rel="stylesheet" th:href="@{/css/cpa-ui.css}" />
</head>
<body class="cpa-body">
<div class="cpa-page">
  <header class="cpa-header">
    <div class="cpa-header-inner">
      <a href="/home" class="cpa-brand">
        <span class="cpa-brand-mark">CPA</span>
        <span>
          <span class="cpa-brand-kicker">Avaliacao</span>
          <span class="cpa-brand-title">Resposta do participante</span>
        </span>
      </a>
      <form th:action="@{/logout}" method="post" class="cpa-logout-form" sec:authorize="isAuthenticated()">
        <input type="hidden" th:name="${_csrf?.parameterName}" th:value="${_csrf?.token}" />
        <button type="submit" class="cpa-button cpa-button-secondary cpa-button-small">Sair</button>
      </form>
    </div>
  </header>

  <main class="cpa-main cpa-main-narrow">
    <section class="cpa-hero">
      <div>
        <p class="cpa-kicker">Questionario</p>
        <h1 th:text="${questionnaire.name}">Avaliacao CPA</h1>
        <p>As questoes obrigatorias precisam ser respondidas antes do envio.</p>
      </div>
      <a href="/home" class="cpa-button cpa-button-secondary">Cancelar</a>
    </section>

    <section class="cpa-panel" style="margin-top:18px">
      <div th:if="${error}" class="cpa-alert cpa-alert-danger" th:text="${error}"></div>
      <div th:if="${success}" class="cpa-alert cpa-alert-success" th:text="${success}"></div>

      <div aria-live="polite" style="margin-bottom:18px">
        <div class="cpa-progress" aria-hidden="true">
          <div class="cpa-progress-bar" data-cpa-progress-bar></div>
        </div>
        <p class="cpa-help" style="margin-top:8px" data-cpa-progress-text>0 respondidas</p>
      </div>

      <form th:action="@{/avaliacoes/{id}/responder(id=${avaliacao.id})}"
            method="post"
            data-cpa-response-form
            data-cpa-loading>
        <input type="hidden" th:name="${_csrf?.parameterName}" th:value="${_csrf?.token}" />

        <article th:each="q, idx : ${questions}" class="cpa-question" data-cpa-question>
          <div class="cpa-question-header">
            <div>
              <p class="cpa-question-number">
                Questao <span th:text="${idx.index + 1}">1</span>
                <span class="cpa-badge cpa-badge-info" th:text="${q.itemAvaliacao != null ? q.itemAvaliacao.name() : 'GERAL'}">GERAL</span>
              </p>
              <h2 class="cpa-question-title" th:text="${q.text}">Texto da questao</h2>
            </div>
            <span th:if="${q.type.name() == 'QUANTITATIVA'}" class="cpa-badge cpa-badge-success">Obrigatoria</span>
          </div>

          <div th:if="${q.type.name() == 'QUANTITATIVA'}" class="cpa-shell">
            <div class="cpa-field">
              <p class="cpa-label">Importancia</p>
              <div class="cpa-radio-grid">
                <label class="cpa-option">
                  <input type="radio" th:name="'importanciaQuestao[' + ${q.id} + ']'" value="BAIXA" required />
                  <span>Baixa</span>
                </label>
                <label class="cpa-option">
                  <input type="radio" th:name="'importanciaQuestao[' + ${q.id} + ']'" value="MEDIA" required />
                  <span>Media</span>
                </label>
                <label class="cpa-option">
                  <input type="radio" th:name="'importanciaQuestao[' + ${q.id} + ']'" value="ALTA" required />
                  <span>Alta</span>
                </label>
              </div>
            </div>

            <div class="cpa-field">
              <p class="cpa-label">Satisfacao</p>
              <div class="cpa-radio-grid">
                <label class="cpa-option">
                  <input type="radio" th:name="'responses[' + ${q.id} + ']'" value="1" required />
                  <span th:text="${q.option1Label != null ? q.option1Label : 'Discordo totalmente'}">Discordo totalmente</span>
                </label>
                <label class="cpa-option">
                  <input type="radio" th:name="'responses[' + ${q.id} + ']'" value="2" required />
                  <span th:text="${q.option2Label != null ? q.option2Label : 'Discordo parcialmente'}">Discordo parcialmente</span>
                </label>
                <label class="cpa-option">
                  <input type="radio" th:name="'responses[' + ${q.id} + ']'" value="3" required />
                  <span th:text="${q.option3Label != null ? q.option3Label : 'Concordo parcialmente'}">Concordo parcialmente</span>
                </label>
                <label class="cpa-option">
                  <input type="radio" th:name="'responses[' + ${q.id} + ']'" value="4" required />
                  <span th:text="${q.option4Label != null ? q.option4Label : 'Concordo totalmente'}">Concordo totalmente</span>
                </label>
              </div>
              <label th:if="${q.option5Label != null and !#strings.isEmpty(q.option5Label)}" class="cpa-option" style="margin-top:10px">
                <input type="radio" th:name="'responses[' + ${q.id} + ']'" value="0" required />
                <span th:text="${q.option5Label}">Nao sei opinar</span>
              </label>
            </div>
          </div>

          <div th:if="${q.type.name() == 'QUALITATIVA'}" class="cpa-field">
            <label th:for="'q-' + ${q.id}">Resposta</label>
            <textarea class="cpa-textarea"
                      th:id="'q-' + ${q.id}"
                      th:name="'responses[' + ${q.id} + ']'"
                      placeholder="Digite sua resposta"></textarea>
          </div>
        </article>

        <div class="cpa-actions" style="margin-top:18px;justify-content:flex-end">
          <a href="/home" class="cpa-button cpa-button-secondary">Cancelar</a>
          <button type="submit" class="cpa-button cpa-button-primary" data-loading-text="Enviando...">Enviar respostas</button>
        </div>
      </form>
    </section>
  </main>
</div>
<script th:src="@{/js/cpa-ui.js}"></script>
</body>
</html>
