<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title th:text="|Erro ${statusCode != null ? statusCode : 500}|">Erro</title>
  <link rel="stylesheet" th:href="@{/css/cpa-ui.css}" />
</head>

<body class="cpa-body">
  <main class="cpa-login-page">
    <section class="cpa-login-card-wrap">
      <div class="cpa-panel cpa-login-card">
        <div class="cpa-panel-header" style="display:block;text-align:center">
          <p class="cpa-kicker" th:text="${errorTitle != null ? errorTitle : 'Erro'}">Erro</p>
          <h1 class="cpa-panel-title" style="font-size:2rem;margin-top:6px"
              th:text="${statusCode != null ? statusCode : 500}">500</h1>
          <p class="cpa-panel-subtitle">Nao foi possivel concluir a operacao.</p>
        </div>

        <div class="cpa-alert cpa-alert-danger"
             th:text="${errorMessage != null ? errorMessage : 'Ocorreu uma falha ao processar sua solicitacao.'}">
          Ocorreu uma falha ao processar sua solicitacao.
        </div>

        <p th:if="${traceId}" class="cpa-help" style="text-align:center;margin-top:12px">
          Identificador do erro: <span th:text="${traceId}">trace</span>
        </p>

        <div class="cpa-actions" style="margin-top:18px;justify-content:center">
          <a href="/home" class="cpa-button cpa-button-primary">Ir para o painel</a>
          <a href="/login" class="cpa-button cpa-button-secondary">Fazer login com outra conta</a>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
