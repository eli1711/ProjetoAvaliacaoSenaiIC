<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title th:text="${cadastroAluno} ? 'Cadastro de aluno' : 'Usuario - Sistema CPA'">Usuario - Sistema CPA</title>
  <link rel="stylesheet" th:href="@{/css/cpa-ui.css}" />
</head>
<body class="cpa-body">
<div class="cpa-page">
  <header class="cpa-header">
    <div class="cpa-header-inner">
      <a th:href="${cadastroAluno} ? @{/login} : @{/home}" class="cpa-brand">
        <span class="cpa-brand-mark">CPA</span>
        <span>
          <span class="cpa-brand-kicker">Sistema CPA</span>
          <span class="cpa-brand-title" th:text="${cadastroAluno} ? 'Cadastro de aluno' : 'Cadastro de usuario'">Cadastro</span>
        </span>
      </a>
      <nav class="cpa-nav" sec:authorize="isAuthenticated()">
        <a href="/dev" class="cpa-nav-link" sec:authorize="hasAuthority('ROLE_SUPER_ADMIN')">Dev</a>
        <a href="/users" class="cpa-nav-link">Usuarios</a>
        <a href="/home" class="cpa-nav-link">Painel</a>
        <form th:action="@{/logout}" method="post" class="cpa-logout-form">
          <input type="hidden" th:name="${_csrf?.parameterName}" th:value="${_csrf?.token}" />
          <button type="submit" class="cpa-button cpa-button-secondary cpa-button-small">Sair</button>
        </form>
      </nav>
      <a href="/login" class="cpa-button cpa-button-secondary cpa-button-small" sec:authorize="!isAuthenticated()">Entrar</a>
    </div>
  </header>

  <main class="cpa-main cpa-main-narrow">
    <section class="cpa-hero">
      <div>
        <p class="cpa-kicker" th:text="${cadastroAluno} ? 'Primeiro acesso' : 'Gestao de acesso'">Cadastro</p>
        <h1 th:text="${cadastroAluno} ? 'Cadastro de aluno' : 'Cadastro de usuario'">Cadastro</h1>
        <p th:text="${cadastroAluno} ? 'Informe seus dados para solicitar acesso como aluno.' : 'Preencha os dados de acesso e perfil do usuario.'">
          Preencha os dados.
        </p>
      </div>
    </section>

    <section class="cpa-panel" style="margin-top:18px">
      <div th:if="${error}" class="cpa-alert cpa-alert-danger" th:text="${error}"></div>
      <div th:if="${success}" class="cpa-alert cpa-alert-success" th:text="${success}"></div>

      <form th:action="${cadastroAluno} ? @{/users/aluno/registrar} : @{/users/save}"
            th:object="${user}"
            method="post"
            class="cpa-form-grid"
            data-cpa-loading>
        <input type="hidden" th:name="${_csrf?.parameterName}" th:value="${_csrf?.token}" />

        <div class="cpa-field" style="grid-column:span 2">
          <label for="name">Nome completo</label>
          <input type="text" id="name" th:field="*{name}" required class="cpa-input" />
        </div>

        <div class="cpa-field" style="grid-column:span 2">
          <label for="email">E-mail</label>
          <input type="email" id="email" th:field="*{email}" required class="cpa-input" />
        </div>

        <div class="cpa-field" style="grid-column:span 2">
          <label for="username">Login de acesso</label>
          <input type="text"
                 id="username"
                 th:field="*{username}"
                 th:readonly="${user.username != null and !cadastroAluno}"
                 required
                 class="cpa-input" />
          <p class="cpa-help">Este login identifica o usuario no sistema.</p>
        </div>

        <div class="cpa-field" style="grid-column:span 2">
          <label for="password">Senha</label>
          <input type="password"
                 id="password"
                 th:field="*{password}"
                 th:required="${user.username == null || cadastroAluno}"
                 th:placeholder="${user.username != null && !cadastroAluno} ? 'Deixe em branco para manter' : ''"
                 class="cpa-input" />
          <p class="cpa-help" th:text="${passwordRules}">Use uma senha forte.</p>
        </div>

        <div class="cpa-field" style="grid-column:span 2">
          <label for="ra">RA / Matricula</label>
          <input type="text" id="ra" th:field="*{ra}" class="cpa-input" />
        </div>

        <div class="cpa-field" style="grid-column:span 2" th:if="${superAdmin and !cadastroAluno}">
          <label for="instituicaoId">Instituicao</label>
          <select id="instituicaoId" name="instituicaoId" class="cpa-select">
            <option value="">Sem instituicao</option>
            <option th:each="i : ${instituicoes}"
                    th:value="${i.id}"
                    th:text="${i.nome}"
                    th:selected="${user.instituicao != null and user.instituicao.id == i.id}">
            </option>
          </select>
          <p class="cpa-help">Use sem instituicao apenas para perfil dev.</p>
        </div>

        <div class="cpa-field" style="grid-column:span 2">
          <label for="turmaId">Turma</label>
          <select id="turmaId" name="turmaId" class="cpa-select">
            <option value="">Sem turma</option>
            <option th:each="t : ${turmas}"
                    th:value="${t.id}"
                    th:text="${(superAdmin and t.instituicao != null ? t.instituicao.nome + ' - ' : '') + t.nome + ' - ' + t.curso + ' (' + t.ano + '/' + t.semestre + ')'}"
                    th:selected="${user.turma != null and user.turma.id == t.id}">
            </option>
          </select>
        </div>

        <div class="cpa-field cpa-field-full" th:if="${cadastroAluno}">
          <input type="hidden" th:field="*{role}" />
          <p class="cpa-alert cpa-alert-warning" style="margin:0">Seu perfil sera aluno.</p>
        </div>

        <div class="cpa-field cpa-field-full" th:unless="${cadastroAluno}">
          <label for="role">Perfil</label>
          <select id="role" th:field="*{role}" required class="cpa-select">
            <option value="">Selecione</option>
            <option value="ROLE_SUPER_ADMIN" th:if="${superAdmin}">Dev / Super admin</option>
            <option value="ROLE_ADMIN">Administrador</option>
            <option value="ROLE_GESTOR">Gestor CPA</option>
            <option value="ROLE_COORDENADOR">Coordenador</option>
            <option value="ROLE_ALUNO">Aluno</option>
            <option value="ROLE_PROFESSOR">Professor</option>
            <option value="ROLE_COLABORADOR">Colaborador</option>
            <option value="ROLE_AVALIADOR_EXTERNO">Avaliador externo</option>
          </select>
        </div>

        <div class="cpa-actions cpa-field-full" style="justify-content:flex-end">
          <a th:href="${cadastroAluno} ? @{/login} : @{/users}" class="cpa-button cpa-button-secondary">Cancelar</a>
          <button type="submit" class="cpa-button cpa-button-primary" data-loading-text="Salvando..."
                  th:text="${cadastroAluno} ? 'Criar cadastro' : 'Salvar usuario'">Salvar</button>
        </div>
      </form>
    </section>
  </main>
</div>
<script th:src="@{/js/cpa-ui.js}"></script>
</body>
</html>
