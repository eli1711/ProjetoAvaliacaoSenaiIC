<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>Instituicao - Sistema CPA</title>
  <link rel="stylesheet" th:href="@{/css/cpa-ui.css}" />
</head>
<body class="cpa-body">
<div class="cpa-page">
  <header class="cpa-header">
    <div class="cpa-header-inner">
      <a href="/dev/instituicoes" class="cpa-brand">
        <span class="cpa-brand-mark">CPA</span>
        <span>
          <span class="cpa-brand-kicker">Painel dev</span>
          <span class="cpa-brand-title">Instituicao</span>
        </span>
      </a>
      <button class="cpa-menu-button" type="button" aria-label="Abrir menu" aria-expanded="false" data-cpa-menu-button="main-nav">
        <span></span><span></span><span></span>
      </button>
      <nav id="main-nav" class="cpa-nav" aria-label="Navegacao principal">
        <a href="/dev" class="cpa-nav-link">Dev</a>
        <a href="/dev/instituicoes" class="cpa-nav-link is-active">Instituicoes</a>
        <a href="/users" class="cpa-nav-link">Usuarios</a>
        <a href="/auditoria" class="cpa-nav-link">Auditoria</a>
        <form th:action="@{/logout}" method="post" class="cpa-logout-form" sec:authorize="isAuthenticated()">
          <input type="hidden" th:name="${_csrf?.parameterName}" th:value="${_csrf?.token}" />
          <button type="submit" class="cpa-button cpa-button-secondary cpa-button-small">Sair</button>
        </form>
      </nav>
    </div>
  </header>

  <main class="cpa-main cpa-main-narrow">
    <section class="cpa-hero">
      <div>
        <p class="cpa-kicker">Cadastro institucional</p>
        <h1>Dados da instituicao</h1>
        <p>Essas informacoes identificam a instituicao nos filtros, usuarios e relatorios.</p>
      </div>
    </section>

    <section class="cpa-panel" style="margin-top:18px">
      <form th:action="@{/dev/instituicoes}" th:object="${instituicao}" method="post" class="cpa-form-grid" data-cpa-loading>
        <input type="hidden" th:name="${_csrf?.parameterName}" th:value="${_csrf?.token}" />
        <input type="hidden" th:field="*{id}" />

        <div class="cpa-field" style="grid-column:span 2">
          <label for="nome">Nome</label>
          <input id="nome" type="text" th:field="*{nome}" required class="cpa-input" />
        </div>

        <div class="cpa-field" style="grid-column:span 2">
          <label for="identificadorInstitucional">Identificador institucional</label>
          <input id="identificadorInstitucional" type="text" th:field="*{identificadorInstitucional}" required class="cpa-input" />
        </div>

        <div class="cpa-field" style="grid-column:span 2">
          <label for="cnpj">CNPJ</label>
          <input id="cnpj" type="text" th:field="*{cnpj}" class="cpa-input" />
        </div>

        <div class="cpa-field" style="grid-column:span 2">
          <label for="periodoLetivoAtual">Periodo letivo atual</label>
          <input id="periodoLetivoAtual" type="text" th:field="*{periodoLetivoAtual}" class="cpa-input" />
        </div>

        <div class="cpa-field cpa-field-full">
          <label for="responsavelInstitucional">Responsavel institucional</label>
          <input id="responsavelInstitucional" type="text" th:field="*{responsavelInstitucional}" class="cpa-input" />
        </div>

        <div class="cpa-field cpa-field-full">
          <label for="contatos">Contatos</label>
          <textarea id="contatos" rows="2" th:field="*{contatos}" class="cpa-textarea"></textarea>
        </div>

        <div class="cpa-field cpa-field-full">
          <label for="endereco">Endereco</label>
          <textarea id="endereco" rows="2" th:field="*{endereco}" class="cpa-textarea"></textarea>
        </div>

        <div class="cpa-field" style="grid-column:span 2">
          <label for="logoUrl">URL da logo</label>
          <input id="logoUrl" type="url" th:field="*{logoUrl}" class="cpa-input" />
        </div>

        <div class="cpa-field" style="grid-column:span 2;align-content:end">
          <label class="cpa-option" style="min-height:42px">
            <input type="checkbox" th:field="*{ativo}" />
            Instituicao ativa
          </label>
        </div>

        <div class="cpa-field cpa-field-full">
          <label for="dadosRelatorio">Dados para relatorio</label>
          <textarea id="dadosRelatorio" rows="3" th:field="*{dadosRelatorio}" class="cpa-textarea"></textarea>
        </div>

        <div class="cpa-actions cpa-field-full" style="justify-content:flex-end">
          <a href="/dev/instituicoes" class="cpa-button cpa-button-secondary">Cancelar</a>
          <button type="submit" class="cpa-button cpa-button-primary" data-loading-text="Salvando...">Salvar</button>
        </div>
      </form>
    </section>
  </main>

  <footer class="cpa-footer"><div class="cpa-footer-inner">Sistema de Avaliacao CPA</div></footer>
</div>
<script th:src="@{/js/cpa-ui.js}"></script>
</body>
</html>
