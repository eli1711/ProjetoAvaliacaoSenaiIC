<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Instituicao - Sistema CPA</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col font-sans">
<header class="bg-red-700 text-white shadow">
  <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center gap-4">
    <a href="/instituicoes" class="font-semibold tracking-tight text-lg flex items-center gap-3">
      <span class="inline-flex items-center justify-center h-9 w-9 rounded-md bg-red-800 text-xs font-bold">CPA</span>
      <span>Instituicao</span>
    </a>
    <form th:action="@{/logout}" method="post" class="inline" sec:authorize="isAuthenticated()">
      <input type="hidden" th:name="${_csrf?.parameterName}" th:value="${_csrf?.token}" />
      <button type="submit" class="px-3 py-1.5 rounded-full bg-red-900 hover:bg-red-800 text-[11px] font-semibold">
        Sair
      </button>
    </form>
  </div>
</header>

<main class="flex-1">
  <div class="max-w-4xl mx-auto px-4 py-8">
    <form th:action="@{/instituicoes}" th:object="${instituicao}" method="post"
          class="bg-white rounded-xl shadow-sm border border-slate-200 p-6 space-y-5">
      <input type="hidden" th:name="${_csrf?.parameterName}" th:value="${_csrf?.token}" />
      <input type="hidden" th:field="*{id}" />

      <div>
        <h1 class="text-2xl font-bold text-slate-900">Dados da Instituicao</h1>
        <p class="text-sm text-slate-600 mt-1">Essas informacoes identificam a instituicao nos filtros e relatorios.</p>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label for="nome" class="block text-sm font-medium text-slate-700 mb-1">Nome</label>
          <input id="nome" type="text" th:field="*{nome}" required
                 class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:border-red-500 focus:ring-2 focus:ring-red-500"/>
        </div>

        <div>
          <label for="identificadorInstitucional" class="block text-sm font-medium text-slate-700 mb-1">Identificador institucional</label>
          <input id="identificadorInstitucional" type="text" th:field="*{identificadorInstitucional}" required
                 class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:border-red-500 focus:ring-2 focus:ring-red-500"/>
        </div>

        <div>
          <label for="cnpj" class="block text-sm font-medium text-slate-700 mb-1">CNPJ</label>
          <input id="cnpj" type="text" th:field="*{cnpj}"
                 class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:border-red-500 focus:ring-2 focus:ring-red-500"/>
        </div>

        <div>
          <label for="periodoLetivoAtual" class="block text-sm font-medium text-slate-700 mb-1">Periodo letivo atual</label>
          <input id="periodoLetivoAtual" type="text" th:field="*{periodoLetivoAtual}"
                 class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:border-red-500 focus:ring-2 focus:ring-red-500"/>
        </div>

        <div class="md:col-span-2">
          <label for="responsavelInstitucional" class="block text-sm font-medium text-slate-700 mb-1">Responsavel institucional</label>
          <input id="responsavelInstitucional" type="text" th:field="*{responsavelInstitucional}"
                 class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:border-red-500 focus:ring-2 focus:ring-red-500"/>
        </div>

        <div class="md:col-span-2">
          <label for="contatos" class="block text-sm font-medium text-slate-700 mb-1">Contatos</label>
          <textarea id="contatos" rows="2" th:field="*{contatos}"
                    class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:border-red-500 focus:ring-2 focus:ring-red-500"></textarea>
        </div>

        <div class="md:col-span-2">
          <label for="endereco" class="block text-sm font-medium text-slate-700 mb-1">Endereco</label>
          <textarea id="endereco" rows="2" th:field="*{endereco}"
                    class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:border-red-500 focus:ring-2 focus:ring-red-500"></textarea>
        </div>

        <div>
          <label for="logoUrl" class="block text-sm font-medium text-slate-700 mb-1">URL da logo</label>
          <input id="logoUrl" type="url" th:field="*{logoUrl}"
                 class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:border-red-500 focus:ring-2 focus:ring-red-500"/>
        </div>

        <div class="flex items-end">
          <label class="inline-flex items-center gap-2 text-sm text-slate-700">
            <input type="checkbox" th:field="*{ativo}" class="h-4 w-4 rounded border-slate-300 text-red-700"/>
            Instituicao ativa
          </label>
        </div>

        <div class="md:col-span-2">
          <label for="dadosRelatorio" class="block text-sm font-medium text-slate-700 mb-1">Dados para relatorio</label>
          <textarea id="dadosRelatorio" rows="3" th:field="*{dadosRelatorio}"
                    class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:border-red-500 focus:ring-2 focus:ring-red-500"></textarea>
        </div>
      </div>

      <div class="flex justify-end gap-3 pt-2">
        <a href="/instituicoes" class="rounded-lg border border-slate-300 px-4 py-2 text-sm font-medium text-slate-700 hover:bg-slate-50">
          Cancelar
        </a>
        <button type="submit" class="rounded-lg bg-red-700 px-5 py-2 text-sm font-semibold text-white hover:bg-red-800">
          Salvar
        </button>
      </div>
    </form>
  </div>
</main>
</body>
</html>
