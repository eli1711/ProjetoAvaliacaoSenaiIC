<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Instituicoes - Sistema CPA</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col font-sans">
<header class="bg-red-700 text-white shadow">
  <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center gap-4">
    <a href="/home" class="font-semibold tracking-tight text-lg flex items-center gap-3">
      <span class="inline-flex items-center justify-center h-9 w-9 rounded-md bg-red-800 text-xs font-bold">CPA</span>
      <span>Instituicoes</span>
    </a>
    <form th:action="@{/logout}" method="post" class="inline" sec:authorize="isAuthenticated()">
      <input type="hidden" th:name="${_csrf?.parameterName}" th:value="${_csrf?.token}" />
      <button type="submit" class="px-3 py-1.5 rounded-full bg-red-900 hover:bg-red-800 text-[11px] font-semibold">
        Sair
      </button>
    </form>
  </div>
</header>

<main class="flex-1">
  <div class="max-w-6xl mx-auto px-4 py-8">
    <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6">
      <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4 mb-6">
        <div>
          <h1 class="text-2xl font-bold text-slate-900">Instituicoes</h1>
          <p class="text-sm text-slate-600 mt-1">Gerencie o cadastro institucional usado para isolamento dos dados.</p>
        </div>
        <a href="/instituicoes/new"
           class="inline-flex items-center justify-center rounded-lg bg-red-700 text-white px-4 py-2 text-sm font-semibold hover:bg-red-800">
          Nova Instituicao
        </a>
      </div>

      <div th:if="${success}" class="mb-4 rounded-lg border border-emerald-300 bg-emerald-50 px-4 py-2 text-sm text-emerald-800">
        <span th:text="${success}">Sucesso</span>
      </div>
      <div th:if="${error}" class="mb-4 rounded-lg border border-red-300 bg-red-50 px-4 py-2 text-sm text-red-800">
        <span th:text="${error}">Erro</span>
      </div>

      <div class="overflow-x-auto">
        <table class="min-w-full text-sm border border-slate-200">
          <thead class="bg-slate-50 text-slate-700">
          <tr>
            <th class="px-4 py-3 text-left">Nome</th>
            <th class="px-4 py-3 text-left">Identificador</th>
            <th class="px-4 py-3 text-left">Periodo atual</th>
            <th class="px-4 py-3 text-left">Status</th>
            <th class="px-4 py-3 text-right">Acoes</th>
          </tr>
          </thead>
          <tbody>
          <tr th:each="i : ${instituicoes}" class="border-t border-slate-100">
            <td class="px-4 py-3 text-slate-800" th:text="${i.nome}">Instituicao</td>
            <td class="px-4 py-3 text-slate-700" th:text="${i.identificadorInstitucional}">ID</td>
            <td class="px-4 py-3 text-slate-700" th:text="${i.periodoLetivoAtual ?: '-'}">2025/2</td>
            <td class="px-4 py-3">
              <span th:if="${i.ativo}" class="rounded-full bg-emerald-50 px-2.5 py-1 text-xs font-semibold text-emerald-700">Ativa</span>
              <span th:unless="${i.ativo}" class="rounded-full bg-slate-100 px-2.5 py-1 text-xs font-semibold text-slate-600">Inativa</span>
            </td>
            <td class="px-4 py-3 text-right space-x-2">
              <a th:href="@{/instituicoes/{id}/edit(id=${i.id})}"
                 class="inline-flex rounded-lg bg-amber-500 px-3 py-1.5 text-xs font-semibold text-white hover:bg-amber-600">
                Editar
              </a>
              <form th:action="@{/instituicoes/{id}/delete(id=${i.id})}" method="post" class="inline">
                <input type="hidden" th:name="${_csrf?.parameterName}" th:value="${_csrf?.token}" />
                <button type="submit"
                        onclick="return confirm('Remover esta instituicao?')"
                        class="inline-flex rounded-lg bg-red-600 px-3 py-1.5 text-xs font-semibold text-white hover:bg-red-700">
                  Remover
                </button>
              </form>
            </td>
          </tr>
          <tr th:if="${#lists.isEmpty(instituicoes)}">
            <td colspan="5" class="px-4 py-8 text-center text-sm text-slate-500">Nenhuma instituicao cadastrada.</td>
          </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</main>
</body>
</html>
