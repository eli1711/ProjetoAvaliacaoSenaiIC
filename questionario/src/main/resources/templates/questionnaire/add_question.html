<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>Nova Questão</title>
  <link rel="stylesheet" th:href="@{/css/cpa-ui.css}" />
</head>

<body class="cpa-body">
<div class="cpa-page">
  <div th:replace="~{fragments :: header('questionnaires', 'Questionarios')}"></div>

  <main class="cpa-main cpa-main-narrow">
    <section class="cpa-hero">
      <div>
        <p class="cpa-kicker">Pergunta</p>
        <h1>Adicionar pergunta</h1>
        <p>Configure texto, tipo, item de avaliacao e alternativas do modelo.</p>
        <p class="cpa-help" th:if="${questionnaire != null}">Questionario: <strong th:text="${questionnaire.name}">Modelo</strong></p>
      </div>
    </section>

    <section class="cpa-panel" style="margin-top:18px">
      <div th:if="${error}" class="cpa-alert cpa-alert-danger" th:text="${error}"></div>

      <form th:action="@{/questionnaires/{id}/questions/new(id=${questionnaire.id})}" method="post" class="cpa-form-grid">
        <input type="hidden" th:name="${_csrf?.parameterName}" th:value="${_csrf?.token}" />
        <input type="hidden" name="score" value="4" />

        <div class="cpa-field cpa-field-full">
          <label for="text">Texto da pergunta</label>
          <input type="text" id="text" name="text" required class="cpa-input" placeholder="Ex.: O conteudo da disciplina foi bem organizado?" />
        </div>

        <div class="cpa-field" style="grid-column: span 2">
          <label for="type">Tipo</label>
          <select id="type" name="type" required class="cpa-select" data-question-type>
            <option value="QUALITATIVA">Qualitativa (resposta aberta)</option>
            <option value="QUANTITATIVA" selected>Quantitativa (multipla escolha)</option>
          </select>
        </div>

        <div class="cpa-field" style="grid-column: span 2">
          <label for="item">Item de avaliacao</label>
          <select id="item" name="item" required class="cpa-select">
            <option value="">Selecione...</option>
            <option th:each="i : ${itensAvaliacao}" th:value="${i}" th:text="${i.descricao}">Item</option>
          </select>
        </div>

        <div class="cpa-form-section" data-quant-fields>
          <h2 class="cpa-form-section-title">Alternativas quantitativas</h2>
          <div class="cpa-form-grid">
            <div class="cpa-field" style="grid-column: span 2">
              <label for="option1Label">Alternativa 1 (25%)</label>
              <input type="text" id="option1Label" name="option1Label" value="Discordo totalmente" class="cpa-input" />
            </div>
            <div class="cpa-field" style="grid-column: span 2">
              <label for="option2Label">Alternativa 2 (50%)</label>
              <input type="text" id="option2Label" name="option2Label" value="Discordo parcialmente" class="cpa-input" />
            </div>
            <div class="cpa-field" style="grid-column: span 2">
              <label for="option3Label">Alternativa 3 (75%)</label>
              <input type="text" id="option3Label" name="option3Label" value="Concordo parcialmente" class="cpa-input" />
            </div>
            <div class="cpa-field" style="grid-column: span 2">
              <label for="option4Label">Alternativa 4 (100%)</label>
              <input type="text" id="option4Label" name="option4Label" value="Concordo totalmente" class="cpa-input" />
            </div>
            <div class="cpa-field cpa-field-full">
              <label for="option5Label">Alternativa 5 opcional (0%)</label>
              <input type="text" id="option5Label" name="option5Label" placeholder="Ex.: Nao sei opinar" class="cpa-input" />
              <p class="cpa-help">Se ficar em branco, essa opcao nao sera exibida ao aluno.</p>
            </div>
          </div>
        </div>

        <div class="cpa-actions cpa-field-full" style="justify-content:flex-end; padding-top:8px">
          <a th:href="@{/questionnaires/{id}(id=${questionnaire.id})}" class="cpa-button cpa-button-secondary">Cancelar</a>
          <button type="submit" class="cpa-button cpa-button-primary">Salvar pergunta</button>
        </div>
      </form>
    </section>
  </main>

  <div th:replace="~{fragments :: footer}"></div>
</div>
<script th:src="@{/js/cpa-ui.js}"></script>
<script>
  document.addEventListener("DOMContentLoaded", function () {
    var typeSelect = document.querySelector("[data-question-type]");
    var quantFields = document.querySelector("[data-quant-fields]");
    if (!typeSelect || !quantFields) return;

    function toggleQuantFields() {
      quantFields.hidden = typeSelect.value !== "QUANTITATIVA";
    }

    typeSelect.addEventListener("change", toggleQuantFields);
    toggleQuantFields();
  });
</script>
<template hidden aria-hidden="true" th:remove="all">

<header class="bg-red-700 text-white shadow">
  <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center gap-4">
    <a href="/home" class="font-semibold tracking-tight text-lg flex items-center gap-3">
      <span class="inline-flex items-center justify-center h-9 w-9 rounded-md bg-red-800 text-xs font-bold">
        CPA
      </span>
      <div class="flex flex-col leading-tight">
        <span class="text-sm uppercase tracking-[0.2em] text-red-100">Sistema CPA</span>
        <span class="text-base">Questionários</span>
      </div>
    </a>

    <nav class="hidden md:flex items-center gap-5 text-xs font-medium"
         sec:authorize="hasAnyAuthority('ROLE_ADMIN','ROLE_GESTOR')">
      <a href="/avaliacoes" class="hover:text-red-100 transition">Avaliações</a>
      <a href="/questionnaires" class="hover:text-red-100 font-semibold underline underline-offset-4 transition">
        Modelos
      </a>
      <a href="/users" class="hover:text-red-100 transition">Usuários</a>
      <a href="/turmas" class="hover:text-red-100 transition">Turmas</a>
      <a href="/analise/avaliacoes" class="hover:text-red-100 transition">Análises</a>
      <a href="/alunos" class="hover:text-red-100 transition">Alunos</a>

      <form th:action="@{/logout}" method="post" class="inline">
        <input type="hidden" th:name="${_csrf?.parameterName}" th:value="${_csrf?.token}" />
        <button type="submit"
                class="ml-2 px-3 py-1.5 rounded-full bg-red-900 hover:bg-red-800 text-[11px] font-semibold shadow-sm transition">
          Sair
        </button>
      </form>
    </nav>

    <div class="flex md:hidden items-center gap-2">
      <a href="/questionnaires"
         class="text-xs px-3 py-1.5 rounded-full bg-red-800 hover:bg-red-900 transition">
        Modelos
      </a>
      <form th:action="@{/logout}" method="post" class="inline" sec:authorize="isAuthenticated()">
        <input type="hidden" th:name="${_csrf?.parameterName}" th:value="${_csrf?.token}" />
        <button
          type="submit"
          class="px-3 py-1.5 rounded-full bg-red-900 hover:bg-red-800 text-[11px] font-semibold shadow-sm transition">
          Sair
        </button>
      </form>
    </div>
  </div>
</header>

<main class="flex-1">
  <div class="max-w-3xl mx-auto px-4 py-10">
    <div class="bg-white mt-4 mb-8 rounded-2xl shadow border border-red-100 p-8">

      <div class="mb-4 text-center">
        <div class="inline-flex items-center gap-2 rounded-full bg-red-50 text-red-700 px-3 py-1 mb-3">
          <span class="inline-block h-2 w-2 rounded-full bg-red-600"></span>
          <span class="text-[11px] font-semibold tracking-wide uppercase">
            Questionário
          </span>
        </div>

        <h1 class="text-2xl font-bold text-slate-900 tracking-tight">
          Adicionar Questão ao Questionário
        </h1>

        <p class="text-sm text-slate-500 mt-2">
          Escolha o item de avaliação e configure a questão.
        </p>

        <p class="text-xs text-slate-400 mt-3" th:if="${questionnaire != null}">
          Questionário:
          <span class="font-semibold text-slate-600" th:text="${questionnaire.name}">
            Nome do questionário
          </span>
        </p>
      </div>

      <div th:if="${error}"
           class="mb-4 text-sm text-red-700 bg-red-50 border border-red-200 rounded-lg px-4 py-2">
        <span th:text="${error}">Erro na criação da questão.</span>
      </div>

      <form th:action="@{/questionnaires/{id}/questions/new(id=${questionnaire.id})}"
            method="post" class="space-y-6">
        <input type="hidden" th:name="${_csrf?.parameterName}" th:value="${_csrf?.token}" />

        <!-- Texto -->
        <div>
          <label for="text" class="block text-sm font-medium text-slate-700 mb-1">
            Texto da Questão
          </label>
          <input
            type="text"
            id="text"
            name="text"
            required
            placeholder="Ex.: O conteúdo da disciplina foi bem organizado?"
            class="w-full px-4 py-2.5 border border-slate-300 rounded-lg text-sm
                   focus:ring-2 focus:ring-red-500 focus:border-red-500 outline-none transition" />
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <!-- Tipo -->
          <div>
            <label for="type" class="block text-sm font-medium text-slate-700 mb-1">
              Tipo da Questão
            </label>
            <select
              id="type"
              name="type"
              required
              class="w-full px-4 py-2.5 border border-slate-300 rounded-lg text-sm
                     focus:ring-2 focus:ring-red-500 focus:border-red-500 outline-none transition">
              <option value="QUALITATIVA">Qualitativa (resposta aberta)</option>
              <option value="QUANTITATIVA" selected>Quantitativa (múltipla escolha)</option>
            </select>
          </div>

          <!-- Item de avaliação -->
          <div>
            <label for="item" class="block text-sm font-medium text-slate-700 mb-1">
              Item de Avaliação
            </label>
            <select id="item" name="item" required
                    class="w-full px-4 py-2.5 border border-slate-300 rounded-lg text-sm
                           focus:ring-2 focus:ring-red-500 focus:border-red-500 outline-none transition bg-white">
              <option value="">Selecione...</option>
              <option th:each="i : ${itensAvaliacao}"
                      th:value="${i}"
                      th:text="${i.descricao}">Item</option>
            </select>
          </div>
        </div>

        <!-- Bloco de alternativas quantitativas -->
        <div id="quant-fields" class="border border-slate-200 rounded-xl p-4 bg-slate-50 space-y-4">
          <p class="text-sm font-semibold text-slate-700">
            Alternativas (múltipla escolha)
          </p>
          <p class="text-xs text-slate-500">
            As alternativas serão avaliadas de 1 a 4, correspondendo a 25%, 50%, 75% e 100%.
          </p>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
            <div>
              <label for="option1Label" class="block text-xs font-medium text-slate-700 mb-1">
                Alternativa 1 (nota 1 / 25%)
              </label>
              <input
                type="text"
                id="option1Label"
                name="option1Label"
                value="Discordo totalmente"
                class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm
                       focus:ring-2 focus:ring-red-500 focus:border-red-500 outline-none transition" />
            </div>

            <div>
              <label for="option2Label" class="block text-xs font-medium text-slate-700 mb-1">
                Alternativa 2 (nota 2 / 50%)
              </label>
              <input
                type="text"
                id="option2Label"
                name="option2Label"
                value="Discordo parcialmente"
                class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm
                       focus:ring-2 focus:ring-red-500 focus:border-red-500 outline-none transition" />
            </div>

            <div>
              <label for="option3Label" class="block text-xs font-medium text-slate-700 mb-1">
                Alternativa 3 (nota 3 / 75%)
              </label>
              <input
                type="text"
                id="option3Label"
                name="option3Label"
                value="Concordo parcialmente"
                class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm
                       focus:ring-2 focus:ring-red-500 focus:border-red-500 outline-none transition" />
            </div>

            <div>
              <label for="option4Label" class="block text-xs font-medium text-slate-700 mb-1">
                Alternativa 4 (nota 4 / 100%)
              </label>
              <input
                type="text"
                id="option4Label"
                name="option4Label"
                value="Concordo totalmente"
                class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm
                       focus:ring-2 focus:ring-red-500 focus:border-red-500 outline-none transition" />
            </div>
          </div>

          <div>
            <label for="option5Label" class="block text-xs font-medium text-slate-700 mb-1">
              Alternativa 5 (opcional, vale 0%)
            </label>
            <input
              type="text"
              id="option5Label"
              name="option5Label"
              placeholder="Ex.: Não sei opinar"
              class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm
                     focus:ring-2 focus:ring-red-500 focus:border-red-500 outline-none transition" />
            <p class="text-[11px] text-slate-400 mt-1">
              Se deixar em branco, a quinta opção não será exibida para o aluno.
            </p>
          </div>
        </div>

        <div class="pt-4 flex justify-center gap-3">
          <a th:href="@{/questionnaires/{id}(id=${questionnaire.id})}"
             class="px-5 py-2 rounded-lg border border-slate-300 text-slate-700 text-sm font-medium
                    hover:bg-slate-100 transition">
            Cancelar
          </a>
          <button type="submit"
                  class="bg-red-700 text-white px-6 py-2.5 rounded-lg font-medium shadow-sm
                         hover:bg-red-800 focus:ring-2 focus:ring-red-500 focus:outline-none transition
                         inline-flex items-center gap-2 text-sm">
            <svg xmlns="http://www.w3.org/2000/svg"
                 class="h-4 w-4" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 4h11l5 5v11H4z" />
              <path d="M12 4v5" />
              <rect x="9" y="13" width="6" height="5" rx="1" />
            </svg>
            <span>Salvar Questão</span>
          </button>
        </div>
      </form>

      <div class="mt-8 text-center">
        <a th:href="@{/questionnaires/{id}(id=${questionnaire.id})}"
           class="text-sm text-red-700 hover:text-red-900 font-medium inline-flex items-center gap-1.5">
          <svg xmlns="http://www.w3.org/2000/svg"
               class="h-4 w-4" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M15 18l-6-6 6-6" />
          </svg>
          <span>Voltar ao questionário</span>
        </a>
      </div>
    </div>
  </div>
</main>

<footer class="border-t border-slate-200 bg-white">
  <div class="max-w-6xl mx-auto px-4 py-4 text-center text-xs text-slate-500">
    © 2025 Sistema de Avaliação CPA
  </div>
</footer>

<script>
  document.addEventListener("DOMContentLoaded", function () {
    const typeSelect = document.getElementById("type");
    const quantFields = document.getElementById("quant-fields");

    function toggleQuantFields() {
      if (typeSelect.value === "QUANTITATIVA") {
        quantFields.style.display = "block";
      } else {
        quantFields.style.display = "none";
      }
    }

    typeSelect.addEventListener("change", toggleQuantFields);
    toggleQuantFields();
  });
</script>

</template>
</body>
</html>
