<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Plano de Acao - Sistema CPA</title>
  <link rel="stylesheet" th:href="@{/css/cpa-ui.css}" />
</head>
<body class="cpa-body">
<div class="cpa-page">
  <div th:replace="~{fragments :: header('planos', 'Planos de Acao')}"></div>

  <main class="cpa-main">
    <section class="cpa-hero">
      <div>
        <p class="cpa-kicker">Plano de melhoria</p>
        <h1 th:text="${plano.id == null ? 'Novo plano de acao' : 'Editar plano de acao'}">Plano de acao</h1>
        <p>Registre problema, responsaveis, prazos, progresso e evidencias de acompanhamento.</p>
      </div>
    </section>

    <section class="cpa-panel" style="margin-top:18px">
      <form th:action="${plano.id == null} ? @{/planos-acao} : @{/planos-acao/{id}/edit(id=${plano.id})}"
            th:object="${plano}"
            method="post"
            class="cpa-form-grid">
        <input type="hidden" th:name="${_csrf?.parameterName}" th:value="${_csrf?.token}" />

        <div class="cpa-field cpa-field-full">
          <label for="avaliacaoId">Avaliacao relacionada</label>
          <select id="avaliacaoId" name="avaliacaoId" class="cpa-select">
            <option value="">Sem avaliacao especifica</option>
            <option th:each="av : ${avaliacoes}"
                    th:value="${av.id}"
                    th:selected="${plano.avaliacaoAplicada != null and plano.avaliacaoAplicada.id == av.id}"
                    th:text="|ID ${av.id} - ${av.turma.nome} - ${av.questionario.name}|">Avaliacao</option>
          </select>
        </div>

        <div class="cpa-field cpa-field-full">
          <label for="problemaIdentificado">Problema identificado</label>
          <textarea id="problemaIdentificado" th:field="*{problemaIdentificado}" required class="cpa-textarea"></textarea>
        </div>

        <div class="cpa-field cpa-field-full">
          <label for="acaoProposta">Acao proposta</label>
          <textarea id="acaoProposta" th:field="*{acaoProposta}" required class="cpa-textarea"></textarea>
        </div>

        <div class="cpa-field" style="grid-column: span 2">
          <label for="indicadorRelacionado">Indicador relacionado</label>
          <input id="indicadorRelacionado" th:field="*{indicadorRelacionado}" type="text" class="cpa-input" />
        </div>

        <div class="cpa-field" style="grid-column: span 2">
          <label for="responsavel">Responsavel</label>
          <input id="responsavel" th:field="*{responsavel}" required type="text" class="cpa-input" />
        </div>

        <div class="cpa-field" style="grid-column: span 2">
          <label for="setorResponsavel">Setor responsavel</label>
          <input id="setorResponsavel" th:field="*{setorResponsavel}" type="text" class="cpa-input" />
        </div>

        <div class="cpa-field" style="grid-column: span 2">
          <label for="dataInicio">Data de inicio</label>
          <input id="dataInicio" th:field="*{dataInicio}" type="date" class="cpa-input" />
        </div>

        <div class="cpa-field" style="grid-column: span 2">
          <label for="prazo">Prazo</label>
          <input id="prazo" th:field="*{prazo}" required type="date" class="cpa-input" />
        </div>

        <div class="cpa-field">
          <label for="prioridade">Prioridade</label>
          <select id="prioridade" th:field="*{prioridade}" class="cpa-select">
            <option th:each="p : ${prioridades}" th:value="${p}" th:text="${p}">MEDIA</option>
          </select>
        </div>

        <div class="cpa-field">
          <label for="status">Status</label>
          <select id="status" th:field="*{status}" class="cpa-select">
            <option th:each="s : ${statusPlanos}" th:value="${s}" th:text="${s}">PLANEJADA</option>
          </select>
        </div>

        <div class="cpa-field" style="grid-column: span 2">
          <label for="percentualConclusao">Conclusao (%)</label>
          <input id="percentualConclusao" th:field="*{percentualConclusao}" type="number" min="0" max="100" class="cpa-input" />
        </div>

        <div class="cpa-field" style="grid-column: span 2">
          <label for="resultadoEsperado">Resultado esperado</label>
          <textarea id="resultadoEsperado" th:field="*{resultadoEsperado}" class="cpa-textarea"></textarea>
        </div>

        <div class="cpa-field" style="grid-column: span 2">
          <label for="resultadoAlcancado">Resultado alcancado</label>
          <textarea id="resultadoAlcancado" th:field="*{resultadoAlcancado}" class="cpa-textarea"></textarea>
        </div>

        <div class="cpa-field cpa-field-full">
          <label for="evidencias">Evidencias</label>
          <textarea id="evidencias" th:field="*{evidencias}" class="cpa-textarea"></textarea>
        </div>

        <div class="cpa-field cpa-field-full">
          <label for="observacoes">Observacoes</label>
          <textarea id="observacoes" th:field="*{observacoes}" class="cpa-textarea"></textarea>
        </div>

        <div class="cpa-actions cpa-field-full" style="justify-content:flex-end; padding-top:8px">
          <a href="/planos-acao" class="cpa-button cpa-button-secondary">Cancelar</a>
          <button type="submit" class="cpa-button cpa-button-primary">Salvar plano</button>
        </div>
      </form>
    </section>
  </main>

  <div th:replace="~{fragments :: footer}"></div>
</div>
<script th:src="@{/js/cpa-ui.js}"></script>
<template hidden aria-hidden="true" th:remove="all">

<header class="bg-red-700 text-white shadow">
  <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center gap-4">
    <a href="/home" class="font-semibold tracking-tight text-lg flex items-center gap-3">
      <span class="inline-flex items-center justify-center h-9 w-9 rounded-md bg-red-800 text-xs font-bold">CPA</span>
      <div class="flex flex-col leading-tight">
        <span class="text-sm uppercase tracking-[0.2em] text-red-100">Sistema CPA</span>
        <span class="text-base">Plano de Acao</span>
      </div>
    </a>
    <nav class="hidden md:flex items-center gap-5 text-xs font-medium"
         sec:authorize="hasAnyAuthority('ROLE_ADMIN','ROLE_GESTOR')">
      <a href="/planos-acao" class="hover:text-red-100 transition">Planos</a>
      <a href="/analise/avaliacoes" class="hover:text-red-100 transition">Analises</a>
      <form th:action="@{/logout}" method="post" class="inline">
        <input type="hidden" th:name="${_csrf?.parameterName}" th:value="${_csrf?.token}" />
        <button type="submit" class="ml-2 px-3 py-1.5 rounded-full bg-red-900 hover:bg-red-800 text-[11px] font-semibold shadow-sm transition">
          Sair
        </button>
      </form>
    </nav>
  </div>
</header>

<main class="flex-1">
  <div class="max-w-5xl mx-auto px-4 py-10">
    <div class="bg-white shadow-xl rounded-2xl p-8 border border-red-100">
      <div class="mb-6">
        <div class="inline-flex items-center gap-2 rounded-full bg-red-50 text-red-700 px-3 py-1 mb-2">
          <span class="inline-block h-2 w-2 rounded-full bg-red-600"></span>
          <span class="text-[11px] font-semibold tracking-wide uppercase">Plano de melhoria</span>
        </div>
        <h1 class="text-2xl font-bold text-slate-900"
            th:text="${plano.id == null ? 'Novo plano de acao' : 'Editar plano de acao'}">
          Plano de acao
        </h1>
      </div>

      <form th:action="${plano.id == null} ? @{/planos-acao} : @{/planos-acao/{id}/edit(id=${plano.id})}"
            th:object="${plano}"
            method="post"
            class="space-y-6">
        <input type="hidden" th:name="${_csrf?.parameterName}" th:value="${_csrf?.token}" />

        <div>
          <label for="avaliacaoId" class="block text-sm font-medium text-slate-700 mb-1">Avaliacao relacionada</label>
          <select id="avaliacaoId" name="avaliacaoId"
                  class="w-full px-4 py-2 border border-slate-300 rounded-lg text-sm bg-white focus:ring-2 focus:ring-red-500 focus:border-red-500 outline-none">
            <option value="">Sem avaliacao especifica</option>
            <option th:each="av : ${avaliacoes}"
                    th:value="${av.id}"
                    th:selected="${plano.avaliacaoAplicada != null and plano.avaliacaoAplicada.id == av.id}"
                    th:text="|ID ${av.id} - ${av.turma.nome} - ${av.questionario.name}|">
            </option>
          </select>
        </div>

        <div>
          <label for="problemaIdentificado" class="block text-sm font-medium text-slate-700 mb-1">Problema identificado</label>
          <textarea id="problemaIdentificado" th:field="*{problemaIdentificado}" required rows="3"
                    class="w-full px-4 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-red-500 focus:border-red-500 outline-none"></textarea>
        </div>

        <div>
          <label for="indicadorRelacionado" class="block text-sm font-medium text-slate-700 mb-1">Indicador relacionado</label>
          <input id="indicadorRelacionado" th:field="*{indicadorRelacionado}" type="text"
                 class="w-full px-4 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-red-500 focus:border-red-500 outline-none"/>
        </div>

        <div>
          <label for="acaoProposta" class="block text-sm font-medium text-slate-700 mb-1">Acao proposta</label>
          <textarea id="acaoProposta" th:field="*{acaoProposta}" required rows="3"
                    class="w-full px-4 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-red-500 focus:border-red-500 outline-none"></textarea>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label for="responsavel" class="block text-sm font-medium text-slate-700 mb-1">Responsavel</label>
            <input id="responsavel" th:field="*{responsavel}" required type="text"
                   class="w-full px-4 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-red-500 focus:border-red-500 outline-none"/>
          </div>
          <div>
            <label for="setorResponsavel" class="block text-sm font-medium text-slate-700 mb-1">Setor responsavel</label>
            <input id="setorResponsavel" th:field="*{setorResponsavel}" type="text"
                   class="w-full px-4 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-red-500 focus:border-red-500 outline-none"/>
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label for="dataInicio" class="block text-sm font-medium text-slate-700 mb-1">Data de inicio</label>
            <input id="dataInicio" th:field="*{dataInicio}" type="date"
                   class="w-full px-4 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-red-500 focus:border-red-500 outline-none"/>
          </div>
          <div>
            <label for="prazo" class="block text-sm font-medium text-slate-700 mb-1">Prazo</label>
            <input id="prazo" th:field="*{prazo}" required type="date"
                   class="w-full px-4 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-red-500 focus:border-red-500 outline-none"/>
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
          <div>
            <label for="prioridade" class="block text-sm font-medium text-slate-700 mb-1">Prioridade</label>
            <select id="prioridade" th:field="*{prioridade}"
                    class="w-full px-4 py-2 border border-slate-300 rounded-lg text-sm bg-white focus:ring-2 focus:ring-red-500 focus:border-red-500 outline-none">
              <option th:each="p : ${prioridades}" th:value="${p}" th:text="${p}"></option>
            </select>
          </div>
          <div>
            <label for="status" class="block text-sm font-medium text-slate-700 mb-1">Status</label>
            <select id="status" th:field="*{status}"
                    class="w-full px-4 py-2 border border-slate-300 rounded-lg text-sm bg-white focus:ring-2 focus:ring-red-500 focus:border-red-500 outline-none">
              <option th:each="s : ${statusPlanos}" th:value="${s}" th:text="${s}"></option>
            </select>
          </div>
          <div>
            <label for="percentualConclusao" class="block text-sm font-medium text-slate-700 mb-1">Conclusao (%)</label>
            <input id="percentualConclusao" th:field="*{percentualConclusao}" type="number" min="0" max="100"
                   class="w-full px-4 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-red-500 focus:border-red-500 outline-none"/>
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label for="resultadoEsperado" class="block text-sm font-medium text-slate-700 mb-1">Resultado esperado</label>
            <textarea id="resultadoEsperado" th:field="*{resultadoEsperado}" rows="3"
                      class="w-full px-4 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-red-500 focus:border-red-500 outline-none"></textarea>
          </div>
          <div>
            <label for="resultadoAlcancado" class="block text-sm font-medium text-slate-700 mb-1">Resultado alcancado</label>
            <textarea id="resultadoAlcancado" th:field="*{resultadoAlcancado}" rows="3"
                      class="w-full px-4 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-red-500 focus:border-red-500 outline-none"></textarea>
          </div>
        </div>

        <div>
          <label for="evidencias" class="block text-sm font-medium text-slate-700 mb-1">Evidencias</label>
          <textarea id="evidencias" th:field="*{evidencias}" rows="3"
                    class="w-full px-4 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-red-500 focus:border-red-500 outline-none"></textarea>
        </div>

        <div>
          <label for="observacoes" class="block text-sm font-medium text-slate-700 mb-1">Observacoes</label>
          <textarea id="observacoes" th:field="*{observacoes}" rows="3"
                    class="w-full px-4 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-red-500 focus:border-red-500 outline-none"></textarea>
        </div>

        <div class="pt-4 flex justify-center gap-3">
          <a href="/planos-acao" class="px-5 py-2 rounded-lg border border-slate-300 text-slate-700 text-sm font-medium hover:bg-slate-100 transition">
            Cancelar
          </a>
          <button type="submit" class="bg-red-700 text-white px-6 py-2.5 rounded-lg font-medium shadow-sm hover:bg-red-800 transition text-sm">
            Salvar plano
          </button>
        </div>
      </form>
    </div>
  </div>
</main>

<footer class="border-t border-slate-200 bg-white">
  <div class="max-w-6xl mx-auto px-4 py-4 text-center text-xs text-slate-500">
    &copy; 2026 Sistema de Avaliacao CPA
  </div>
</footer>

</template>
</body>
</html>
